name: ai_surveillance_system

services:
  backend:
    build:
      context: .
      target: backend
    init: true
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - docker/backend.env
    environment:
      # Set this in the root .env file only when Video Q&A is required.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.6-flash}"
    volumes:
      - backend_database:/app/backend/database
      - backend_data:/app/backend/data
      - backend_models:/app/backend/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
      args:
        BACKEND_URL: /api
    init: true
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  backend_database:
  backend_data:
  backend_models:
